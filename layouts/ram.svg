    <text x="6.8" y="53" fill="#6f9a7e" font-size="3">▾</text><text x="9.5" y="53" fill="#ffb547">0x02</text><text x="21.5" y="53" fill="#ffb547">web</text><text x="77" y="53" fill="#ffb547">±2</text>
