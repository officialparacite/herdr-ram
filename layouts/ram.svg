    <rect x="234" y="9" width="24" height="8" rx="0.8" fill="#2a2412" stroke="#ffb547"/>
    <rect x="261" y="9" width="26" height="8" rx="0.8" fill="#0b130f" stroke="#2c4a38"/>
    <rect x="290" y="9" width="24" height="8" rx="0.8" fill="#0b130f" stroke="#2c4a38"/>
  </g>
  <g font-family="monospace" font-size="3.8">
    <text x="33.5" y="14.4" fill="#ffb547">*1</text><text x="41" y="14.4" fill="#ffb547">claude</text>
    <text x="70.5" y="14.4" fill="#6f9a7e">&amp;2</text><text x="78" y="14.4" fill="#c8f7d3">zsh</text>
    <text x="103.5" y="14.4" fill="#6f9a7e">&amp;3</text><text x="111" y="14.4" fill="#c8f7d3">zsh</text>
    <text x="136.4" y="14.6" fill="#c8f7d3">+</text>
    <text x="225" y="14.4" fill="#6f9a7e">^b</text>
    <text x="236.5" y="14.4" fill="#ffb547">m</text><text x="241" y="14.4" fill="#ffb547">meta</text>
    <text x="263.5" y="14.4" fill="#ffb547">i</text><text x="268" y="14.4" fill="#5f8a70">space</text>
    <text x="292.5" y="14.4" fill="#ffb547">r</text><text x="297" y="14.4" fill="#5f8a70">hunk</text>
  </g>
  <line x1="0" y1="20.5" x2="320" y2="20.5" stroke="#24402f" stroke-width="0.5"/>

