<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <!-- RAM in its meta level: the strip on top, the main stick (0x00 @) on the left,
       the terminal, and every space as a stick of memory under it. -->
  <rect width="320" height="200" fill="#060a08"/>
  <g font-family="monospace" font-size="3.4" fill="#3f5a49">
    <text x="60" y="4.5">0x0000</text><text x="110" y="4.5">0x0400</text><text x="160" y="4.5">0x0800</text>
    <text x="210" y="4.5">0x0C00</text><text x="260" y="4.5">0x1000</text>
  </g>

  <!-- The strip: the space you're in, its tabs, +, then ^b and the level buttons. -->
  <g font-family="monospace" font-size="4.2">
    <text x="7" y="14.6" fill="#6fe3d3">0x02</text><text x="18.5" y="14.6" fill="#ffb547">web</text>
  </g>
  <g stroke-width="0.6">
