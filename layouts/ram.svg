    <rect x="40.5" y="153" width="1.5" height="2.5"/><rect x="44" y="153" width="1.5" height="2.5"/><rect x="47.5" y="153" width="1.5" height="2.5"/><rect x="51" y="153" width="1.5" height="2.5"/><rect x="54.5" y="153" width="1.5" height="2.5"/><rect x="58" y="153" width="1.5" height="2.5"/><rect x="61.5" y="153" width="1.5" height="2.5"/><rect x="65" y="153" width="1.5" height="2.5"/><rect x="68.5" y="153" width="1.5" height="2.5"/><rect x="72" y="153" width="1.5" height="2.5"/><rect x="75.5" y="153" width="1.5" height="2.5"/><rect x="79" y="153" width="1.5" height="2.5"/>
