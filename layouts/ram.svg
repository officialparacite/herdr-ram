  </g>
  <line x1="12" y1="95" x2="80" y2="95" stroke="#24402f" stroke-width="0.5" stroke-dasharray="1.6 1.6"/>
  <rect x="6.3" y="113.5" width="79.4" height="6" fill="#2a0f14"/>
